services:
  quote-agent:
    build: .
    image: quote-agent:dev
    env_file: .env
    environment:
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: 11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CLOUD_API_BASE_URL: http://mock-cloud:8000/api/internal/agent
      RAG_ENABLED: ${RAG_ENABLED:-false}
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "pytest", "-q"]

  mock-cloud:
    image: quote-agent:dev
    command: ["python", "scripts/mock_cloud.py", "--host", "0.0.0.0", "--port", "8000", "--seed-dir", "data/mock_tasks"]
    volumes:
      - ./:/app
    ports:
      - "8000:8000"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
